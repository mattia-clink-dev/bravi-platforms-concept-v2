<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bravi Platforms — Homepage V2</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300..800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#151515}
.v2 *{box-sizing:border-box}
a{color:#C4000F}a:hover{color:#8F000B}
.v2 :focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.06em}
@keyframes rise{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:none}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.btn{display:inline-flex;align-items:center;gap:12px;text-decoration:none;font-weight:700;transition:background-color .25s,color .25s}
.btn .arr{display:inline-block;transition:transform .25s}.btn:hover .arr{transform:translateX(6px)}
.btn-red{background:var(--acc);color:#FFFFFF}.btn-red:hover{background:#B5050F;color:#FFFFFF}
.btn-w{background:#FFFFFF;color:#151515}.btn-w:hover{background:#151515;color:#FFFFFF}
.btn-lw{border:1.5px solid #FFFFFF;color:#FFFFFF}.btn-lw:hover{background:#FFFFFF;color:#151515}
.io{opacity:0;transform:translateY(40px);transition:opacity .9s ease,transform 1s cubic-bezier(.2,.7,.1,1)}
.io.in{opacity:1;transform:none}
.cmm::before{counter-reset:mm var(--mm,0);content:counter(mm)}
.cdeg::before{counter-reset:dg var(--deg,0);content:counter(dg)}
.calt::before{counter-reset:al var(--alt,0);content:counter(al)}

/* ALTIMETRO */
.alt{position:fixed;left:20px;top:50%;transform:translateY(-50%);z-index:50;mix-blend-mode:difference;color:#FFFFFF;pointer-events:none}
.alt-fill{transform:scaleY(var(--altp,0));transform-origin:bottom}

/* 3D */
.stage3d{perspective:1500px;perspective-origin:50% 30%;cursor:grab;touch-action:none}
.stage3d:active{cursor:grabbing}
.model{position:absolute;left:50%;top:88%;width:0;height:0;transform-style:preserve-3d;transform:rotateX(-14deg) rotateY(var(--ry,-30deg))}
.g3{position:absolute;left:0;top:0;transform-style:preserve-3d}
.gu1{transform:translateY(calc(var(--up,0px) * -.333))}
.gu2{transform:translateY(calc(var(--up,0px) * -.667))}
.gu{transform:translateY(calc(var(--up,0px) * -1))}
.bx{position:absolute;left:0;top:0;transform-style:preserve-3d}
.f{position:absolute;left:0;top:0;display:block;background:var(--c)}
.fr{width:var(--w);height:var(--h);transform:translate(-50%,-50%) translateZ(calc(var(--d) / 2))}
.bk{width:var(--w);height:var(--h);transform:translate(-50%,-50%) rotateY(180deg) translateZ(calc(var(--d) / 2));box-shadow:inset 0 0 0 999px rgba(0,0,0,.18)}
.rt{width:var(--d);height:var(--h);transform:translate(-50%,-50%) rotateY(90deg) translateZ(calc(var(--w) / 2));box-shadow:inset 0 0 0 999px rgba(0,0,0,.28)}
.lf{width:var(--d);height:var(--h);transform:translate(-50%,-50%) rotateY(-90deg) translateZ(calc(var(--w) / 2));box-shadow:inset 0 0 0 999px rgba(0,0,0,.1)}
.tp{width:var(--w);height:var(--d);transform:translate(-50%,-50%) rotateX(90deg) translateZ(calc(var(--h) / 2));box-shadow:inset 0 0 0 999px rgba(255,255,255,.14)}
.bt{width:var(--w);height:var(--d);transform:translate(-50%,-50%) rotateX(-90deg) translateZ(calc(var(--h) / 2));box-shadow:inset 0 0 0 999px rgba(0,0,0,.5)}
.chip{cursor:pointer;transition:background-color .25s,color .25s,border-color .25s}
.chip:hover{border-color:#FFFFFF}
.chip.on{background:var(--acc);border-color:var(--acc);color:#FFFFFF}

/* SPLIT */
.half{flex:1 1 0;min-width:0;transition:flex-grow .9s cubic-bezier(.7,0,.2,1)}
.split:hover .half{flex-grow:.7}
.split .half:hover{flex-grow:1.6}
.half .h-up{transition:transform 1s cubic-bezier(.3,.7,.2,1)}
.half:hover .h-up{transform:translateY(-70px)}
.half .h-more{opacity:0;transform:translateY(16px);transition:opacity .4s,transform .5s}
.half:hover .h-more,.half:focus-visible .h-more{opacity:1;transform:none;transition-delay:.3s}
.half .h-arr{transition:transform .4s}
.half:hover .h-arr{transform:rotate(-45deg)}

/* ANATOMIA */
.lay{position:absolute;inset:0;transition:transform 1.2s cubic-bezier(.7,0,.2,1)}
.lab{opacity:0;transition:opacity .5s}
.exploded .lab{opacity:1;transition-delay:1s}

/* SKYLINE */
.bar{cursor:pointer;transform-origin:bottom;transform:scaleY(0);transition:transform 1.2s cubic-bezier(.2,.7,.1,1),height .9s cubic-bezier(.2,.7,.1,1),background-color .3s}
.sky.in .bar{transform:scaleY(1)}
.barbtn:hover .bar,.barbtn.on .bar{background-color:var(--acc)}
.barbtn .bval{opacity:0;transition:opacity .3s}
.barbtn:hover .bval,.barbtn.on .bval{opacity:1}
.mtog{cursor:pointer}
.mtog.on{background:#151515;color:#FFFFFF}

/* FINDER */
.ftrack{display:flex;transition:transform .9s cubic-bezier(.7,0,.2,1)}
.fpanel{flex:0 0 100%;min-width:0}
.fchip{cursor:pointer;transition:background-color .25s,color .25s,border-color .25s}
.fchip:hover{border-color:#151515}
.fchip.on{background:#151515;color:#FFFFFF;border-color:#151515}
.fres{animation:rise .8s cubic-bezier(.2,.7,.1,1) both}
input[type=range]{accent-color:var(--acc);width:100%;height:28px;cursor:pointer}

/* STORIA */
.htrack{display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:8px}
.htrack::-webkit-scrollbar{display:none}
.hcard{flex:0 0 min(560px, 86%);scroll-snap-align:start}
@keyframes nowCycle{0%,30%{clip-path:inset(0 0 0 100%)}45%,85%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}
.hcard .now{clip-path:inset(0 0 0 100%);animation:nowCycle 9s cubic-bezier(.7,0,.2,1) infinite;transition:clip-path 1s cubic-bezier(.7,0,.2,1)}
.hcard:hover .now{animation:none;clip-path:inset(0 0 0 0)}
.still .hcard .now{clip-path:inset(0 0 0 0)}
.hprog{transform:scaleX(var(--sx,.25));transform-origin:left}

/* CASE */
.cslide{position:absolute;inset:0;clip-path:inset(0 0 0 100%);z-index:0}
.cslide.prev{clip-path:inset(0 0 0 0);z-index:1}
.cslide.on{clip-path:inset(0 0 0 0);z-index:2;transition:clip-path 1.2s cubic-bezier(.7,0,.2,1)}
.cslide.on .ctxt{animation:rise .9s cubic-bezier(.2,.7,.1,1) .6s both}
.cslide.on .cimg{animation:kb 7s linear both}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}

/* CONTATTO */
.mq{display:flex;width:max-content;animation:marquee 30s linear infinite}

/* DINAMICITÀ+ */
.model,.model *{pointer-events:none}
.model{transform:rotateX(var(--rx,-14deg)) rotateY(var(--ry,-30deg))}
.tag3d{position:absolute;left:0;top:0;white-space:nowrap;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.06em;color:#FFFFFF;background:rgba(21,21,21,.88);border:1px solid var(--acc);padding:5px 9px;pointer-events:none}
@keyframes splitL{0%,42%{flex-grow:1.5}50%,92%{flex-grow:.75}100%{flex-grow:1.5}}
@keyframes splitR{0%,42%{flex-grow:.75}50%,92%{flex-grow:1.5}100%{flex-grow:.75}}
@keyframes hupA{0%,42%{transform:translateY(-70px)}50%,92%{transform:none}100%{transform:translateY(-70px)}}
@keyframes hupB{0%,42%{transform:none}50%,92%{transform:translateY(-70px)}100%{transform:none}}
@keyframes hmA{0%,42%{opacity:1;transform:none}50%,92%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:none}}
@keyframes hmB{0%,42%{opacity:0;transform:translateY(16px)}50%,92%{opacity:1;transform:none}100%{opacity:0;transform:translateY(16px)}}
.split:not(:hover) .half:nth-of-type(1){animation:splitL 9s cubic-bezier(.7,0,.2,1) infinite}
.split:not(:hover) .half:nth-of-type(2){animation:splitR 9s cubic-bezier(.7,0,.2,1) infinite}
.split:not(:hover) .half:nth-of-type(1) .h-up{animation:hupA 9s cubic-bezier(.3,.7,.2,1) infinite}
.split:not(:hover) .half:nth-of-type(2) .h-up{animation:hupB 9s cubic-bezier(.3,.7,.2,1) infinite}
.split:not(:hover) .half:nth-of-type(1) .h-more{animation:hmA 9s ease infinite}
.split:not(:hover) .half:nth-of-type(2) .h-more{animation:hmB 9s ease infinite}
[data-rv]{clip-path:inset(0 0 100% 0);transform:translateY(40px);transition:clip-path 1.1s cubic-bezier(.7,0,.2,1),transform 1.1s cubic-bezier(.2,.7,.1,1)}
[data-rv].in{clip-path:inset(-10% -5% -25% -5%);transform:none}
.skw{transform:skewX(calc(var(--skew,0) * 1deg))}
.cur{position:fixed;left:0;top:0;z-index:100;pointer-events:none;width:44px;height:44px;margin:-22px 0 0 -22px;border:1.5px solid var(--acc);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--acc);font-weight:800;font-size:16px;opacity:0;transition:width .25s,height .25s,margin .25s,background-color .25s,opacity .3s}
.cur.on{opacity:1}
.cur.big{width:84px;height:84px;margin:-42px 0 0 -42px;background:rgba(227,6,19,.16)}
@media (hover: none){.cur{display:none}}
@media (prefers-reduced-motion: reduce){.v2 [data-rv]{clip-path:none;transform:none}.v2 .cur{display:none}}
.still [data-rv]{clip-path:none;transform:none}

/* NAV + MEGA MENU */
.navl{position:relative;color:#FFFFFF;text-decoration:none;font-size:15px;font-weight:600;padding:10px 0}
.navl::after{content:'';position:absolute;left:0;right:0;bottom:2px;height:2px;background:var(--acc);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.navl:hover{color:#FFFFFF}.navl:hover::after,.mm-wrap:focus-within .navl::after{transform:scaleX(1)}
.mm-wrap::after{content:'';position:absolute;left:-20px;right:-20px;top:100%;height:26px}
.mega{position:absolute;top:100%;left:-28px;margin-top:22px;width:780px;background:#FFFFFF;color:#151515;padding:28px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;opacity:0;visibility:hidden;transform:translateY(12px);transition:opacity .3s,transform .4s cubic-bezier(.2,.7,.1,1),visibility 0s linear .4s;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.mm-wrap:hover .mega,.mm-wrap:focus-within .mega{opacity:1;visibility:visible;transform:none;transition:opacity .3s,transform .4s cubic-bezier(.2,.7,.1,1)}
.mlink{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #E2E2E2;color:#2B2B2A;text-decoration:none;font-weight:600;font-size:15px}
.mlink:hover{color:#C4000F}.mlink .arr{display:inline-block;transition:transform .25s}.mlink:hover .arr{transform:translateX(5px)}
@media (max-width: 1240px){.mainnav{display:none !important}}
.tick{display:flex;width:max-content;animation:marquee 44s linear infinite}

/* GAMMA COMPLETA */
.gcard{display:none;flex-direction:column;background:#1E1E1E;border:1px solid #333333;transition:border-color .3s,background-color .3s}
.gcard.show{display:flex;animation:rise .7s cubic-bezier(.2,.7,.1,1) both}
.gcard:hover{border-color:var(--acc);background:#232323}
.gcard .g-up{transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.gcard:hover .g-up{transform:translateY(-34px)}
.gcard .gidx{transition:-webkit-text-stroke-color .3s}
.gcard:hover .gidx{-webkit-text-stroke-color:var(--acc)}
.gfb,.cmpbtn{cursor:pointer;transition:background-color .25s,color .25s,border-color .25s}
.gfb:hover,.cmpbtn:hover{border-color:#FFFFFF}
.gfb.on{background:#FFFFFF;color:#151515;border-color:#FFFFFF}
.cmpbtn.on{background:var(--acc);border-color:var(--acc);color:#FFFFFF}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.cbarx{transform-origin:left;animation:growX 1s cubic-bezier(.2,.7,.1,1) both}

/* TECNOLOGIE */
@keyframes tprog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.ttab{cursor:pointer;transition:color .3s,background-color .3s}
.ttab:hover{color:#FFFFFF}
.ttab.on{color:#FFFFFF;background:#1E1E1E}
.ttab .tf{transform:scaleX(0);transform-origin:left}
.ttab.on .tf{transform:scaleX(1)}
.ttab.on.run .tf{animation:tprog 7s linear both}
.tpanel{display:none}
.tpanel.show{display:flex;animation:rise .7s cubic-bezier(.2,.7,.1,1) both}
@keyframes up70{0%,12%{transform:none}48%,72%{transform:translateY(-70px)}100%{transform:none}}
@keyframes up140{0%,12%{transform:none}48%,72%{transform:translateY(-140px)}100%{transform:none}}
@keyframes up210{0%,12%{transform:none}48%,72%{transform:translateY(-210px)}100%{transform:none}}
@keyframes dimY{0%,12%{transform:scaleY(0)}48%,72%{transform:scaleY(1)}100%{transform:scaleY(0)}}
.a70{animation:up70 6s cubic-bezier(.6,0,.3,1) infinite}
.a140{animation:up140 6s cubic-bezier(.6,0,.3,1) infinite}
.a210{animation:up210 6s cubic-bezier(.6,0,.3,1) infinite}
.adim{transform-box:fill-box;transform-origin:50% 100%;animation:dimY 6s cubic-bezier(.6,0,.3,1) infinite}
@property --cyc{syntax:'<integer>';inherits:false;initial-value:200}
@keyframes cyc{0%{--cyc:0}85%,100%{--cyc:200}}
.cyc{animation:cyc 6s linear infinite;counter-reset:cy var(--cyc)}
.cyc::before{content:counter(cy)}
@keyframes batt{0%{transform:scaleX(1)}85%,100%{transform:scaleX(.12)}}
.abatt{transform-box:fill-box;transform-origin:0 50%;animation:batt 6s linear infinite}
@keyframes tspin{0%,10%{transform:rotate(0deg)}45%,55%{transform:rotate(180deg)}90%,100%{transform:rotate(360deg)}}
.aspin{transform-box:view-box;transform-origin:240px 200px;animation:tspin 6s cubic-bezier(.6,0,.3,1) infinite}
@keyframes pass{0%{transform:translateY(170px)}100%{transform:translateY(-220px)}}
.apass{animation:pass 5s linear infinite}
@keyframes needle{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
.aneedle{transform-box:view-box;transform-origin:240px 260px;animation:needle 3s ease-in-out infinite}

/* OLTRE LA SCALA */
.pf .pbar{transform:scaleX(0);transform-origin:left;transition:transform 1.4s cubic-bezier(.2,.7,.1,1)}
.pf.in .pbar{transform:scaleX(1)}

/* SERVIZI + NEWS */
.svc2{transition:background-color .4s,color .4s,border-color .4s}
.svc2:hover{background:#151515;color:#FFFFFF;border-color:#151515}
.svc2:hover .svc-p{color:#CFCFCF}
.svc2 .svc-ic{transition:transform .5s cubic-bezier(.2,.7,.1,1)}
.svc2:hover .svc-ic{transform:translateY(-6px) rotate(-6deg)}
.svc2 .arr{display:inline-block;transition:transform .25s}.svc2:hover .arr{transform:translateX(6px)}
.ncard{display:none;flex-direction:column;text-decoration:none;color:#2B2B2A}
.ncard.show{display:flex;animation:rise .7s cubic-bezier(.2,.7,.1,1) both}
.ncard .nimg{transition:transform .9s cubic-bezier(.2,.7,.1,1)}
.ncard:hover .nimg{transform:scale(1.05)}
.ncard .arr{display:inline-block;transition:transform .25s}.ncard:hover .arr{transform:translateX(6px)}
.svc-link{color:#C4000F}
.svc2:hover .svc-link{color:#FF8A8A}
.nfb{cursor:pointer;background:none;border:0;font:inherit;font-size:19px;color:#5E5E5D;padding:8px 0;min-height:44px}
.nfb:hover{color:#151515}
.nfb.on{color:#C4000F;text-decoration:underline;text-underline-offset:6px}

/* FIRMA V2 — il Λ, le quote, il blueprint */
@keyframes drawL{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
.lam{stroke-dasharray:1400;animation:drawL 2.4s cubic-bezier(.7,0,.2,1) .3s both}
.bigmm{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:clamp(160px,17vw,300px);font-weight:800;letter-spacing:-.06em;line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.14);font-variant-numeric:tabular-nums;pointer-events:none;white-space:nowrap}
.f{transition:background-color .8s ease,box-shadow .8s ease}
[data-view="wire"] .f{background:rgba(227,6,19,.06) !important;box-shadow:inset 0 0 0 1px rgba(255,140,140,.9) !important}
.viewlbl::before{content:'VISTA · SOLIDO'}
[data-view="wire"] .viewlbl::before{content:'VISTA · BLUEPRINT'}
.peak{position:relative;margin-top:-40px;clip-path:polygon(0 40px,46% 40px,50% 0,54% 40px,100% 40px,100% 100%,0 100%)}
.lvl{position:absolute;left:50%;top:50px;transform:translateX(-50%);z-index:5;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.08em;white-space:nowrap;pointer-events:none;background:#151515;color:#FFFFFF;padding:6px 12px;border:1px solid rgba(255,255,255,.3)}
.cut{clip-path:polygon(0 0,44% 0,50% 22px,56% 0,100% 0,100% 100%,0 100%)}
@media (max-width: 860px){
.split{flex-direction:column;height:auto !important}
.half{min-height:420px}
.hero-grid{flex-direction:column}
.alt{display:none}
}
@media (prefers-reduced-motion: reduce){
.v2 *,.v2 *::before,.v2 *::after{animation:none !important;transition:none !important}
.v2 .io{opacity:1;transform:none}.v2 .bar{transform:scaleY(1)}
}
.still *,.still *::before,.still *::after{animation:none !important;transition:none !important}
.still .io{opacity:1;transform:none}.still .bar{transform:scaleY(1)}
</style>

</head>
<body>
<div id="app"></div>
<template id="dc-tpl">

<div class="{{rootClass}}" ref="{{refs.root}}" onPointerMove="{{onMove}}" style="--acc: {{accent}}; width: 100%; min-height: 100%; background: #151515; color: #FFFFFF; font-family: Manrope, system-ui, sans-serif; font-size: 18px; line-height: 1.55">


<sc-if value="{{scrollMode}}" hint-placeholder-val="{{ false }}">
<div class="alt" aria-hidden="true">
<div class="mono" style="font-size: 10px; margin-bottom: 8px">QUOTA</div>

<span style="font-size: 22px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1">Trova la tua macchina in 30 secondi.</span>
<span style="font-weight: 700">Inizia →</span>
</a>
</div>
</div>

<a class="navl" href="#servizi">Servizi</a>
<a class="navl" href="#storia">About Us</a>
<a class="navl" href="#applicazioni">Case Studies</a>
<a class="navl" href="#news">News</a>
</nav>
<div style="display: flex; align-items: center; gap: 16px">
<a href="#top" aria-current="true" style="width: 44px; height: 44px; border-radius: 50%; background: var(--acc); color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 15px">IT</a>

      { k: 'res', n: '02', t: 'Cantiere residenziale', m: ['Residential 170', 'Leonardo HD'] },
      { k: 'man', n: '03', t: 'Manutenzione industriale', m: ['Leonardo HD', 'Leonardo HD 430', 'Lui 460'] },
      { k: 'log', n: '04', t: 'Logistica e magazzini', m: ['Spin-Go', 'Sprint', 'Sprint Large Parcels'] },
      { k: 'ret', n: '05', t: 'Retail e punti vendita', m: ['Spin-Go', 'Sprint'] },
      { k: 'tyr', n: '06', t: 'Pneumatici', m: ['Sprint Tire Lifter'] }
    ];
    const fSectors = SEC.map((s) => ({
      n: s.n, t: s.t, on: s.k === S.fSector, cls: s.k === S.fSector ? 'fchip on' : 'fchip',
      pick: () => this.setState({ fSector: s.k, step: 1 })
    }));
    let res = null;
    const sec = SEC.find((s) => s.k === S.fSector);
    if (sec) {
      const cands = P.filter((p) => sec.m.indexOf(p.name) >= 0);
      const withData = cands.filter((p) => p.work > 0).sort((x, y) => x.work - y.work);
      let best = withData.find((p) => p.work >= S.need);
      let fit;
      if (best) fit = '✓ ' + fmt(best.work) + ' MM DI LAVORO — COPRE I TUOI ' + fmt(S.need) + ' MM';
      else if (withData.length) { best = withData[withData.length - 1]; fit = 'LA PIÙ ALTA DEL SETTORE: ' + fmt(best.work) + ' MM DI LAVORO'; }
      else { best = cands[0]; fit = 'ALTEZZE DA VERIFICARE SULLA SCHEDA TECNICA'; }
      const others = cands.filter((p) => p !== best).map((p) => p.name);
      res = {
        name: best.name, desc: best.desc, sector: sec.t.toUpperCase(), fit,
        alt: others.length ? 'ALTERNATIVE: ' + others.join(' · ').toUpperCase() : '',
        isLift: best.kind === 'lift', isPicker: best.kind === 'picker'
      };
    }
    const stepNames = ['01 SETTORE', '02 ALTEZZA', '03 SOLUZIONE'];
    const steps = stepNames.map((l, i) => ({ label: l, color: i <= S.step ? accent : '#8A8A89', text: i <= S.step ? '#2B2B2A' : '#5E5E5D' }));

    // Storia
    const history = [
      { y: '1980', tag: 'LE ORIGINI', t: 'Dal cantiere alla prima piattaforma', d: 'Dall’esperienza di BRAVIISOL nell’installazione di pareti e controsoffitti nasce la prima piattaforma mobile.' },
      { y: '1995', tag: 'IDRAULICA', t: 'Le prime piattaforme idrauliche', d: 'I primi modelli a sollevamento idraulico, tra cui LUI MINI, precursore di Leonardo HD.' },
      { y: '2010', tag: 'IL MARCHIO', t: 'Nasce Bravi Platforms', d: 'Il marchio Bravi Platforms e la gamma Sprint dedicata al picking.' },
      { y: 'Oggi', tag: 'NEL MONDO', t: 'Innovazione e presenza internazionale', d: '7.000 m² di stabilimento a Castelfidardo, oltre 740 clienti in 48 paesi.' }
    ].map((m, i) => ({ ...m, i: '0' + (i + 1), s0: i === 0, s1: i === 1, s2: i === 2, s3: i === 3, nowDelay: 'animation-delay: ' + (i * 1.2).toFixed(1) + 's' }));

    // Case
    const C = [
      { sector: 'CANTIERE RESIDENZIALE', sol: 'Residential 170', title: 'Ristrutturazione di interni · [CLIENTE]', res: '[RISULTATO OTTENUTO]', bg: '#3A3A39' },
      { sector: 'MANUTENZIONE INDUSTRIALE', sol: 'Leonardo HD 430', title: 'Manutenzione impianti · [CLIENTE]', res: '[RISULTATO OTTENUTO]', bg: '#2E2E2D' },
      { sector: 'LOGISTICA', sol: 'Sprint', title: 'Picking in magazzino · [CLIENTE]', res: '[RISULTATO OTTENUTO]', bg: '#444443' },
      { sector: 'RETAIL', sol: 'Spin-Go', title: 'Riassortimento punto vendita · [CLIENTE]', res: '[RISULTATO OTTENUTO]', bg: '#262626' }
    ];
    const cases = C.map((c, i) => ({
      ...c, n: '0' + (i + 1), hidden: i !== S.cs, s0: i === 0, s1: i === 1, s2: i === 2, s3: i === 3,
      cls: i === S.cs ? 'cslide on' : (i === S.prevCs ? 'cslide prev' : 'cslide')
    }));
    const goCs = (i) => this.setState({ prevCs: this.state.cs, cs: (i + 4) % 4 });
    const csRun = S.csPlay && motion;

    // TICKER
    const tk = ['ISO 9001:2015', 'CE', 'UL / CSA', 'ANSI-SAIA A92.20', 'INDUSTRIA 4.0', 'MADE IN ITALY', '48 PAESI', '740+ CLIENTI', 'RICAMBI IN 48 ORE', 'DAL 1980'];

    // GAMMA COMPLETA + CONFRONTO
    const G = [
      { id: 'res', name: 'Residential 170', cat: 'aerial', kind: 'lift', tag: 'CANTIERE RESIDENZIALE', desc: 'La prima piattaforma pensata per il cantiere residenziale: solo 360 kg.', work: 3700, plat: 1700, load: 180, weight: 360, width: 667 },
      { id: 'hd', name: 'Leonardo HD', cat: 'aerial', kind: 'lift', tag: 'COMPATTA E ROBUSTA', desc: 'Fino a 5 metri di altezza di lavoro, per finiture e manutenzione.', work: 4900, plat: 2900, load: 227, weight: 560, width: 0 },
      { id: 'hd430', name: 'Leonardo HD 430', cat: 'aerial', kind: 'lift', tag: 'PIÙ ALTEZZA, STESSA COMPATTEZZA', desc: '6,3 metri di altezza di lavoro in 760 mm di larghezza.', work: 6300, plat: 4300, load: 180, weight: 0, width: 760 },
      { id: 'lui', name: 'Lui 460', cat: 'aerial', kind: 'lift', tag: 'HIGH-CYCLE', desc: 'Fino a 200 cicli o 9 km con una carica, fino a 6,6 metri di lavoro.', work: 6620, plat: 4620, load: 0, weight: 1250, width: 760 },
      { id: 'sprint', name: 'Sprint', cat: 'picking', kind: 'picker', tag: 'STERZATA 0°', desc: 'Il commissionatore che ruota nel proprio ingombro, per corsie strette.', work: 5350, plat: 3350, load: 130, weight: 690, width: 808 },
      { id: 'spin', name: 'Spin-Go', cat: 'picking', kind: 'picker', tag: 'A SPINTA, MOTORIZZATO', desc: 'Leggero e agile, con sollevamento motorizzato.', work: 4168, plat: 2168, load: 130, weight: 280, width: 730 },
      { id: 'lp', name: 'Sprint Large Parcels', cat: 'picking', kind: 'picker', tag: 'PACCHI INGOMBRANTI', desc: 'Massima efficienza nel picking di pacchi ingombranti.', work: 0, plat: 0, load: 0, weight: 0, width: 0 },
      { id: 'tl', name: 'Sprint Tire Lifter', cat: 'picking', kind: 'picker', tag: 'PNEUMATICI', desc: 'Sicurezza e affidabilità nella movimentazione degli pneumatici.', work: 0, plat: 0, load: 0, weight: 0, width: 0 }
    ];
    const nd = (v, u) => (v ? fmt(v) + ' ' + u : 'n.d.');
    const gf = S.gf;
    const cmp = S.cmp;
    let gi = 0;
    const gamma = G.map((p, i) => {
      const show = gf === 'all' || gf === p.cat;
      const d = show ? gi++ : 0;
      const inCmp = cmp.indexOf(p.id) >= 0;
      return {
        name: p.name, tag: p.tag, desc: p.desc, idx: '0' + (i + 1),
        catLabel: p.cat === 'aerial' ? 'AERIAL' : 'PICKING',
        isLift: p.kind === 'lift', isPicker: p.kind === 'picker',
        k1: nd(p.work, 'mm'), k2: nd(p.plat, 'mm'),
        k3l: p.load ? 'PORTATA' : 'PESO', k3: p.load ? fmt(p.load) + ' kg' : nd(p.weight, 'kg'),
        cls: show ? 'gcard show' : 'gcard',
        delay: 'animation-delay: ' + (d * 0.07).toFixed(2) + 's',
        inCmp, cmpLabel: inCmp ? '✓ In confronto' : '+ Confronta', cmpCls: inCmp ? 'cmpbtn on' : 'cmpbtn',
        toggleCmp: () => {
          const c = this.state.cmp.slice();
          const ix = c.indexOf(p.id);
          if (ix >= 0) c.splice(ix, 1); else { if (c.length >= 3) c.shift(); c.push(p.id); }
          this.setState({ cmp: c });
        }
      };
    });
    const gfBtns = [['all', 'Tutta la gamma'], ['aerial', 'Aerial Platforms'], ['picking', 'Picking Solutions']].map(([k, l]) => ({
      label: l, on: gf === k, cls: gf === k ? 'gfb on' : 'gfb', pick: () => this.setState({ gf: k })
    }));
    const selG = G.filter((p) => cmp.indexOf(p.id) >= 0);
    const cmpRows = [['ALTEZZA DI LAVORO', 'work', 'mm'], ['ALTEZZA PIATTAFORMA', 'plat', 'mm'], ['PORTATA', 'load', 'kg'], ['PESO', 'weight', 'kg'], ['LARGHEZZA', 'width', 'mm']].map(([label, key, u]) => {
      const max = Math.max(1, ...selG.map((p) => p[key] || 0));
      return {
        label,
        cells: selG.map((p) => ({
          v: p[key] ? fmt(p[key]) + ' ' + u : 'n.d.',
          bar: 'display: block; height: 6px; margin-top: 8px; background: ' + (p[key] ? 'var(--acc)' : 'transparent') + '; width: ' + ((p[key] || 0) / max * 100).toFixed(0) + '%'
        }))
      };
    });

    // TECNOLOGIE
    const TT = [['01', 'Sollevamento verticale'], ['02', 'Batterie High-Cycle'], ['03', 'Sterzata 0°'], ['04', 'Ingombro ridotto'], ['05', 'Stabilità e certificazioni']];
    const ttRun = S.ttPlay && motion;
    const techTabs = TT.map(([n, t], i) => ({
      n, t, on: i === S.tt,
      cls: 'ttab' + (i === S.tt ? ' on' : '') + (i === S.tt && ttRun ? ' run' : ''),
      pick: () => this.setState({ tt: i, ttPlay: false })
    }));
    const tpc = (i) => (i === S.tt ? 'tpanel show' : 'tpanel');

    // NEWS
    const nf = S.nf;
    const nfBtns = ['Tutti', 'Case Studies', 'Eventi', 'Press'].map((f) => ({
      label: f, on: f === nf, cls: f === nf ? 'nfb on' : 'nfb', pick: () => this.setState({ nf: f })
    }));
    const newsOn = nf === 'Tutti' || nf === 'Press';

    const mqBase = ['Let’s move forward together —', 'Engineering in Motion —'];

    return {
      accent,
      rootClass: motion ? 'v2' : 'v2 still',
      refs,
      scrollMode: S.scrollMode,
      models,
      maxTxt: fmt(this.MODELS[S.model].mm),
      pDown: this.pDown, pMove: this.pMove, pUp: this.pUp,
      onMove: this.onMove,

      anatHead: 'io' + (seen.anat ? ' in' : ''),
      anatStage: ex ? 'exploded' : '',
      ly,
      exploded: ex,
      explodeLabel: ex ? '⤓ Ricomponi la macchina' : '⤒ Scomponi la macchina',
      toggleExplode: () => { this.userExplode = true; this.setState({ exploded: !this.state.exploded }); },

      skyCls: 'sky' + (seen.sky ? ' in' : ''),
      sky, skyA,
      isWork, isPlat: !isWork,
      mWork: isWork ? 'mtog on' : 'mtog',
      mPlat: !isWork ? 'mtog on' : 'mtog',
      setWork: () => this.setState({ skyMode: 'work' }),
      setPlat: () => this.setState({ skyMode: 'plat' }),

      steps,
      trackStyle: 'transform: translateX(' + (-S.step * 100) + '%)',
      fSectors,
      need: S.need,
      needTxt: fmt(S.need),
      onNeed: (e) => this.setState({ need: Number(e.target.value) }),
      back: () => this.setState({ step: 0 }),
      showRes: () => this.setState({ step: 2 }),
      restart: () => this.setState({ step: 0, fSector: null }),
      hasRes: !!res,
      res: res || { name: '', desc: '', sector: '', fit: '', alt: '', isLift: true, isPicker: false },

      history,
      onTrack: this.trackScroll,
      hPrev: () => this.scrollTrack(-1),
      hNext: () => this.scrollTrack(1),

      cases,
      csNum: '0' + (S.cs + 1),
      csPrev: () => { this.setState({ csPlay: false }); goCs(S.cs - 1); },
      csNext: () => { this.setState({ csPlay: false }); goCs(S.cs + 1); },
      csToggle: () => this.setState({ csPlay: !this.state.csPlay }),
      csPlayIcon: csRun ? '❚❚' : '▶',
      csPlayLabel: csRun ? 'Metti in pausa lo slideshow' : 'Avvia lo slideshow',

      mq: mqBase.concat(mqBase, mqBase, mqBase),

      ticker: tk.concat(tk),
      gamma, gfBtns,
      hasCmp: selG.length > 0, noCmp: selG.length === 0, cmpN: selG.length,
      cmpHead: selG.map((p) => ({ name: p.name })),
      cmpRows,
      cmpGrid: 'grid-template-columns: 200px repeat(' + Math.max(1, selG.length) + ', minmax(0, 1fr))',
      clearCmp: () => this.setState({ cmp: [] }),

      techTabs,
      tp0: tpc(0), tp1: tpc(1), tp2: tpc(2), tp3: tpc(3), tp4: tpc(4),
      ttToggle: () => this.setState({ ttPlay: !this.state.ttPlay }),
      ttPlayIcon: ttRun ? '❚❚' : '▶',
      ttPlayLabel: ttRun ? 'Metti in pausa le tecnologie' : 'Avvia le tecnologie',

      pfCls: 'pf' + (seen.proof ? ' in' : ''),

      nfBtns,
      newsCls: newsOn ? 'ncard show' : 'ncard',
      newsEmpty: !newsOn,
      resetNews: () => this.setState({ nf: 'Tutti' })
    };
  }
}

window.__dcMount(Component, {"accent": "#E30613", "motion": true});
</script>
</body>
</html>
